# Save this as: .github/workflows/metrics.yml  (in your ROXYTINA/ROXYTINA profile repo)
#
# Setup:
# 1. Create a classic Personal Access Token: GitHub > Settings > Developer settings >
#    Personal access tokens (classic). Scopes: repo, read:user (add read:org if you use orgs).
# 2. In your profile repo: Settings > Secrets and variables > Actions > New secret,
#    name it METRICS_TOKEN and paste the token.
# 3. Actions tab > "Metrics" > Run workflow. The .svg files will appear in the repo root.

name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"   # daily at midnight UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # 1) Repositories, traffic, lines of code
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ROXYTINA
          template: classic
          filename: repositories.svg
          base: header, repositories
          config_timezone: Asia/Phnom_Penh
          plugin_traffic: yes
          plugin_lines: yes
          plugin_lines_history_limit: 1
          repositories_forks: no

      # 2) Activity + community
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ROXYTINA
          template: classic
          filename: activity_community.svg
          base: ""
          config_timezone: Asia/Phnom_Penh
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_filter: all
          plugin_notable: yes
          plugin_notable_from: organization
          plugin_notable_repositories: yes

      # 3) Isometric contribution calendar + issue/PR follow-up
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ROXYTINA
          template: classic
          filename: iso_calendar_followup.svg
          base: ""
          config_timezone: Asia/Phnom_Penh
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_followup: yes
          plugin_followup_sections: repositories

      # 4) Coding habits (the commits-per-hour / day-of-week charts)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ROXYTINA
          template: classic
          filename: habits.svg
          base: ""
          config_timezone: Asia/Phnom_Penh
          plugin_habits: yes
          plugin_habits_from: 100
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

      # 5) Achievements
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ROXYTINA
          template: classic
          filename: achievements.svg
          base: ""
          config_timezone: Asia/Phnom_Penh
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact
          plugin_achievements_limit: 0
